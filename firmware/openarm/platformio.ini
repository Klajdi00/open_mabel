; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Set the default environment that builds when you hit "Build" or "Upload"
default_envs = mabel_main

; --- BASE CONFIGURATION ---
; All environments will inherit these settings
[env]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

; Global Dependencies (PlatformIO will auto-download this)
lib_deps =
    tonton81/FlexCAN_T4 @ ^1.3.3

; --- ENVIRONMENT: MAIN ROBOT ---
[env:mabel_main]
; Include everything in src/, exclude the tools/ folder and the ArmLink gateway
; main (which has its own setup()/loop() — see env:mabel_armlink).
build_src_filter =
    +<../src/>
    -<../tools/>
    -<../src/main_armlink.cpp>

; --- ENVIRONMENT: ARMLINK ETHERNET GATEWAY (the deployed arms firmware) ---
; UDP MIT gateway for both arms on the QSFP28 lane (192.168.125.10:5800).
; Contract: include/armlink_protocol.h + hardware_bridge/docs/ARMLINK.md.
[env:mabel_armlink]
build_src_filter =
    +<../src/main_armlink.cpp>
lib_deps =
    ${env.lib_deps}
    ssilverman/QNEthernet @ ^0.30.0

; --- ENVIRONMENT: UTILITY SCRIPTS ---

[env:tool_can_scanner]
; Include only the specific tool and the motor class, exclude main.cpp
build_src_filter = 
    +<../tools/can_scanner.cpp>
    +<../src/DamiaoMotor.cpp>
    -<../src/main.cpp>

[env:tool_change_id]
build_src_filter = 
    +<../tools/change_motor_id.cpp>
    +<../src/DamiaoMotor.cpp>
    -<../src/main.cpp>

[env:tool_teleop_cli]
build_src_filter = 
    +<../tools/teleop_cli.cpp>
    +<../src/DamiaoMotor.cpp>
    -<../src/main.cpp>

[env:tool_set_zero]
build_src_filter = 
    +<../tools/set_zero_pos.cpp>
    +<../src/DamiaoMotor.cpp>
    -<../src/main.cpp>

[env:tool_clear_faults]
build_src_filter = 
    +<../tools/clear_faults.cpp>
    +<../src/DamiaoMotor.cpp>
    -<../src/main.cpp>

[env:tool_sine_sweep]
build_src_filter = 
    +<../tools/sine_sweep.cpp>
    +<../src/DamiaoMotor.cpp>
    -<../src/main.cpp>

[env:tool_read_limits]
build_src_filter = 
    +<../tools/read_limits.cpp>
    +<../src/DamiaoMotor.cpp>
    -<../src/main.cpp>

[env:tool_switch_mode]
build_src_filter = 
    +<../tools/switch_mode.cpp>
    +<../src/DamiaoMotor.cpp>
    -<../src/main.cpp>