; PlatformIO Project Configuration File

[platformio]
default_envs = teensy41

[env]
platform = teensy
board = teensy41
framework = arduino
build_unflags = -std=gnu++14
build_flags   = -std=gnu++17
upload_protocol = teensy-cli  ; headless flashing (no GUI Teensy Loader)

; Normal control firmware (host link). Excludes provision.cpp / test_j1.cpp.
; QNEthernet: native Teensy 4.1 Ethernet (lwIP); answers ICMP once the link is up.
; Nanopb: compiles proto/robot.proto -> robot.pb.{c,h} at build time and puts the
; header on the include path (#include "robot.pb.h"); field sizing comes from
; proto/robot.options (auto-discovered by basename). These custom_nanopb_* keys are
; scoped to THIS env only, so the diagnostic/provision sketches never run codegen and
; stay free of the Ethernet/nanopb deps.
[env:teensy41]
build_src_filter = +<*> -<provision.cpp> -<test_j1.cpp> -<test_config.cpp> -<test_regs.cpp> -<test_dxl.cpp> -<test_dxl_rig.cpp>
lib_deps =
    ssilverman/QNEthernet
    nanopb/Nanopb
    bblanchon/ArduinoJson@^7
custom_nanopb_protos = +<proto/robot.proto>
custom_nanopb_options = --error-on-unmatched

; Focused single-actuator (J1) CAN diagnostic. Excludes main.cpp / provision.cpp.
;   pio run -e teensy41_test_j1 -t upload
[env:teensy41_test_j1]
build_src_filter = +<test_j1.cpp> -<main.cpp> -<provision.cpp> -<test_config.cpp> -<test_dxl.cpp> -<test_dxl_rig.cpp>

; Phase-1 SD/JSON config-loader test (no CAN, no motors). Reads /robot.json off the
; built-in SD card and prints the parsed RobotConfig.
;   pio run -e teensy41_test_config -t upload
[env:teensy41_test_config]
build_src_filter = +<test_config.cpp> -<main.cpp> -<provision.cpp> -<test_j1.cpp> -<test_dxl.cpp> -<test_dxl_rig.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7

; One-shot motor ID provisioning sketch. Excludes main.cpp.
;   pio run -e teensy41_provision -t upload
[env:teensy41_provision]
build_src_filter = +<provision.cpp> -<main.cpp> -<test_dxl.cpp> -<test_dxl_rig.cpp>

; Read the MIT range registers (PMAX/VMAX/TMAX, RID 21/22/23) back out of every
; motor over the 0x7FF parameter bus and diff them against /robot.json. Read-only:
; sends nothing but 0x33 reads, never enables a motor. Polls FlexCAN directly (no
; CanBus) so it can see replies on ANY CAN ID.
;   pio run -e teensy41_test_regs -t upload
[env:teensy41_test_regs]
build_src_filter = +<test_regs.cpp> -<main.cpp> -<provision.cpp> -<test_j1.cpp> -<test_config.cpp> -<test_dxl.cpp> -<test_dxl_rig.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7

; DYNAMIXEL bring-up diagnostic on Serial3 (Teensy pin 14, half-duplex single wire).
; No Ethernet / SD / CAN — only the serial bus, so a servo that will not answer can be
; debugged without anything else in the picture. Read-only until you type `move`.
; A factory servo is at 57,600 baud and INVISIBLE to the control firmware (which runs
; the bus at 1 Mbps) until `baud` re-provisions it — `scan` sweeps every rate.
;   pio run -e teensy41_test_dxl -t upload
[env:teensy41_test_dxl]
build_src_filter = +<test_dxl.cpp> -<main.cpp> -<provision.cpp> -<test_j1.cpp> -<test_config.cpp> -<test_regs.cpp> -<test_dxl_rig.cpp>

; ── Standalone bench rig: a bare Teensy 4.0 on USB, pin 14 (TX3) to one servo ──
; The 4.0 has no SD and no Ethernet, so only the sketches that need neither can run
; on it — which is exactly the DYNAMIXEL path. `board` overrides the [env] default.
; Serial3 is pins 14/15 on BOTH the 4.0 and the 4.1, so what passes here is what the
; robot's motherboard Teensy will do.
;
;   pio run -e teensy40_test_dxl -t upload   # protocol poker: scan/info/baud/move
;   pio run -e teensy40_dxl_rig  -t upload   # real DxlBus/DxlActuator/Robot classes
[env:teensy40_test_dxl]
board = teensy40
build_src_filter = +<test_dxl.cpp> -<main.cpp> -<provision.cpp> -<test_j1.cpp> -<test_config.cpp> -<test_regs.cpp> -<test_dxl_rig.cpp>

[env:teensy40_dxl_rig]
board = teensy40
build_src_filter = +<test_dxl_rig.cpp> +<Robot.cpp> -<main.cpp> -<provision.cpp> -<test_j1.cpp> -<test_config.cpp> -<test_regs.cpp> -<test_dxl.cpp>

; Same rig on the 4.1, for re-running the identical contract check on the robot's own
; board once the level shifters are fitted — same binary shape, different silicon.
[env:teensy41_dxl_rig]
build_src_filter = +<test_dxl_rig.cpp> +<Robot.cpp> -<main.cpp> -<provision.cpp> -<test_j1.cpp> -<test_config.cpp> -<test_regs.cpp> -<test_dxl.cpp>
