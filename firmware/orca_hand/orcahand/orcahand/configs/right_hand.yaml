# ORCA RIGHT hand. angle_min/max come from the mabel_description URDF
# (right_* joint limits = orca_core v1 joint_roms in rad); see left_hand.yaml
# header. Motor IDs match right_calibration.json. If a joint moves the wrong
# way in RViz, flip its `invert`.

side: right
calibration_file: right_calibration.json

joints:
  # ---- index ----
  index_pip:  { id: 1,  angle_min: -0.3491, angle_max: 1.8850, invert: false }
  index_mcp:  { id: 2,  angle_min: -0.3491, angle_max: 1.6581, invert: false }
  index_abd:  { id: 3,  angle_min: -0.6458, angle_max: 0.6458, invert: false }
  # ---- middle ----
  middle_abd: { id: 4,  angle_min: -0.6458, angle_max: 0.6458, invert: false }
  middle_pip: { id: 8,  angle_min: -0.3491, angle_max: 1.8675, invert: false }
  middle_mcp: { id: 9,  angle_min: -0.3491, angle_max: 1.5882, invert: false }
  # ---- pinky ----
  pinky_abd:  { id: 5,  angle_min: -0.6458, angle_max: 0.6458, invert: false }
  pinky_pip:  { id: 6,  angle_min: -0.3491, angle_max: 1.8850, invert: false }
  pinky_mcp:  { id: 7,  angle_min: -0.3491, angle_max: 1.7104, invert: false }
  # ---- ring ----
  ring_mcp:   { id: 10, angle_min: -0.3491, angle_max: 1.5882, invert: false }
  ring_pip:   { id: 11, angle_min: -0.3491, angle_max: 1.8675, invert: false }
  ring_abd:   { id: 12, angle_min: -0.6458, angle_max: 0.6358, invert: false }
  # ---- thumb (ORCA cmc/mp/ip == URDF mcp/pip/dip) ----
  thumb_cmc:  { id: 13, angle_min: -0.8727, angle_max: 0.8727, invert: false }
  thumb_abd:  { id: 14, angle_min: -0.3491, angle_max: 0.7330, invert: false }
  thumb_mp:   { id: 15, angle_min: -0.2094, angle_max: 1.8150, invert: false }  # motor id 15 (MP)
  thumb_ip:   { id: 16, angle_min: -0.3491, angle_max: 1.9548, invert: false }  # motor id 16 (IP)
  # ---- wrist ----
  wrist:      { id: 17, angle_min: -0.5236, angle_max: 1.0472, invert: false }