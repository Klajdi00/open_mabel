# systemd drop-in for mabel-hardware-bridge.service  (camera process split).
#
# INSTALL (on the robot / Thor):
#   sudo mkdir -p /etc/systemd/system/mabel-hardware-bridge.service.d
#   sudo cp hardware_bridge/install/mabel-hardware-bridge.service.d/wrist-split.conf \
#           /etc/systemd/system/mabel-hardware-bridge.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart mabel-hardware-bridge
#
# WHY: the bridge is ONE Python process (GIL-bound). With the wrist cams ON the
# bridge, their per-frame decode/publish steals throughput from the front D435i +
# ZED (measured: front dropped 31 -> 15 Hz). This drop-in makes the bridge keep
# front + ZED + depth/clouds but RELEASE the wrist cams, so the separate camera
# node (sensors/ros_camera_node.py, started by server/real_run.sh in `--cameras
# none` wrists-only mode) owns them on its OWN core. Front recovers to ~26 Hz.
#
# TRADEOFF: with this active the bridge no longer serves the wrist MJPEG on :8080
# (the Control Center GUI / app wrist video tiles go dark). ROS wrist topics
# (/camera/wrist_{left,right}/image_raw) are unaffected. To give the wrists back to
# the bridge (single-owner, GUI/app wrist video), remove this file + daemon-reload
# + restart.
[Service]
Environment=MABEL_HW_CAM_WRIST=false
