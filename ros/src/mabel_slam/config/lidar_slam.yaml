# slam_toolbox -- 2D LiDAR SLAM for MABEL (async online mapping).
#
# This is the *LiDAR* SLAM stack, completely separate from the Isaac ROS
# cuVSLAM/nvblox *visual* stack (slam_sim.launch.py / slam.launch.py). It consumes
# ONLY the 2D laser scan and wheel odometry -- no cameras, no GPU.
#
#   in:  /scan            sensor_msgs/LaserScan   (frame: lidar_link, RPLIDAR A3 model)
#        TF odom->base_link                        (swerve_odometry, in sim.launch.py)
#        TF base_link->lidar_link                  (mujoco_sensors_node / URDF)
#   out: /map             nav_msgs/OccupancyGrid
#        TF map->odom      (the SLAM pose correction on top of wheel odom)
#
# Frames/topic match the MJCF-derived sim sensor config (mabel_sim/sensor_config.py:
# LIDAR_TOPIC=/scan, LIDAR_FRAME=lidar_link) and swerve_odometry (odom/base_link).
#
# DO NOT run this at the same time as cuVSLAM (slam_sim.launch.py): both publish
# map->odom and would fight over the TF tree. Pick ONE map->odom source.
slam_toolbox:
  ros__parameters:
    # ---- Plugins ------------------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---- Frames & topics (MABEL conventions) --------------------------------
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping                       # mapping | localization

    # On startup, optionally deserialize a previously saved pose-graph. Leave the
    # filename empty to start a fresh map; set map_file_name + mode: localization
    # (and map_start_pose) to localize against a map saved with the map saver.
    # map_file_name: /path/to/mabel_map
    # map_start_pose: [0.0, 0.0, 0.0]
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02      # 50 Hz map->odom (0 = publish on update only)
    map_update_interval: 0.5            # seconds between occupancy-grid rebuilds
    resolution: 0.05                    # 5 cm cells
    min_laser_range: 0.45               # match the sim footprint self-filter (real A3 ~0.2 m)
    max_laser_range: 12.0               # match the sim LiDAR cutoff (real A3 ~25 m)
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # ---- Mapper: when to add a node to the pose graph ------------------------
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2        # m  -- holonomic base creeps; keep modest
    minimum_travel_heading: 0.2         # rad
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---- Correlation (scan matcher) search windows --------------------------
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ---- Scan matcher penalties ---------------------------------------------
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
